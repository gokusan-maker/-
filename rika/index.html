<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f9e5b">
  <meta name="description" content="中学受験の理科・暗記分野（生物・地学・化学・実験器具）を4択テストと一問一答カードで練習できるアプリ">
