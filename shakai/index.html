<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17191d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="社会ドリル">
  <meta name="description" content="中学受験の社会（地理・歴史・公民）の暗記分野を演習するドリルアプリ">
  <title>社会暗記ドリル ― 中学受験</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar no-print">
      <button class="brand" id="btn-home" aria-label="ホームへ">
        <span class="brand-mark">社</span><span class="brand-text">社会暗記ドリル</span>
      </button>
      <div class="top-right">
        <span class="who" id="who"></span>
        <span class="streak" id="streak" title="連続学習日数"></span>
        <button class="icon-btn" id="btn-stats" aria-label="学習の記録">📊</button>
        <button class="icon-btn" id="btn-settings" aria-label="設定">⚙</button>
      </div>
    </header>
    <main id="view"></main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/readings.js"></script>
  <script src="js/map.js"></script>
  <script src="js/symbols.js"></script>
  <script src="js/climate.js"></script>
  <script src="js/graphs.js"></script>
  <script src="js/exam.js"></script>
  <script src="js/persons.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
