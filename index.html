<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a0c">
  <meta name="description" content="戦国武将カードを育てる大人のための英語学習アプリ">
  <title>武将英語 ― 天下統一の英語道</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">武</span><span class="brand-text">武将英語</span></div>
      <div class="wallet">
        <span class="koban-icon" aria-hidden="true"></span><span id="koban">0</span>
        <button class="icon-btn" id="btn-settings" aria-label="設定">⚙</button>
      </div>
    </header>

    <main id="view"></main>

    <nav class="tabbar">
      <button data-tab="home" class="active"><span class="tab-ico">⛩</span><span>本陣</span></button>
      <button data-tab="battle"><span class="tab-ico">⚔</span><span>合戦</span></button>
      <button data-tab="gacha"><span class="tab-ico">📜</span><span>召喚</span></button>
      <button data-tab="roster"><span class="tab-ico">🎴</span><span>武将帳</span></button>
      <button data-tab="words"><span class="tab-ico">📖</span><span>単語帳</span></button>
    </nav>
  </div>

  <div id="overlay" class="overlay hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/portraits.js"></script>
  <script src="js/warlords.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
